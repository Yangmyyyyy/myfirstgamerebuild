const moveClips = clips.filter(clip => !clip.timings);
let chainOffset = 0;
let chainDuration = 0;
const combo = clips.slice(moveClips.length).flatMap((clip, attack) => clip.frames.map((pose, frame) => {
  const beat = {clip, attack, pose, frame, x: chainOffset + clip.offsetX[frame] - 105, start: chainDuration};
  chainDuration += clip.timings[frame];
  if (frame === clip.frames.length - 1) chainOffset += clip.offsetX[frame];
  return beat;
}));
let manualCombo = null;
const images=clips.map(c=>{let i=new Image();i.src=c.file;return i});let playing=true,flip=false,time=0,last=0,speed=1,manual=null;
function drawPose(g, image, f, scale, walkFrame) {
  const x = (f.x - f.anchorX) * scale;
  const y = (f.y - f.anchorY) * scale;
  if (walkFrame === null) {
    g.drawImage(image, f.x, f.y, f.w, f.h, x, y, f.w * scale, f.h * scale);
    return;
  }

  // 一轮有两步。身体每步起伏一次，肩膀随左右腿交替略微前后摆。
  const phase = walkFrame * Math.PI / 6;
  const sway = 5 * Math.sin(phase);
  const lift = 6 * Math.sin(phase) ** 2;
  const weight = row => {
    // 从腰部向上渐渐增加幅度，让腿和脚沿用原来的落点。
    const blend = Math.max(0, Math.min(1, (f.anchorY - f.y - row - 152) / 88));
    return blend * blend * (3 - 2 * blend);
  };
  const targetY = row => Math.round(y + row * scale - lift * weight(row));

  // 相邻条带共用边界，避免变形时出现水平缝隙。
  for (let row = 0; row < f.h; row += 4) {
    const end = Math.min(row + 4, f.h);
    const top = targetY(row);
    g.drawImage(image, f.x, f.y + row, f.w, end - row,
      x + Math.round(sway * weight((row + end) / 2)), top, f.w * scale, targetY(end) - top);
  }
}
function drawBladeLight(g, attack, frame) {
  // 刀光与刀尖共用角色坐标，翻转朝向时会一起翻转。
  const paths = [
    [
      [-110, -208, 28, -124, 187, -155, 31, -155],
      [-17, -166, 76, -112, 176, -130, 94, -131],
    ],
    [
      [73, -132, 151, -139, 191, -132, 151, -126],
      [93, -141, 179, -152, 212, -141, 165, -131],
      [111, -142, 173, -151, 210, -142, 175, -136],
    ],
    [
      [-10, -324, 102, -322, 164, -263, 105, -298],
      [131, -282, 230, -177, 168, -53, 192, -168],
      [179, -174, 207, -77, 154, -10, 188, -86],
    ],
  ];
  const lightIndex = frame - (attack === 2 ? 3 : 2);
  const points = paths[attack][lightIndex];
  if (!points) return;
  const [startX, startY, outerX, outerY, tipX, tipY, innerX, innerY] = points;
  g.globalAlpha = attack === 0 ? [.96, .46][lightIndex] : [.62, .96, .32][lightIndex];
  g.beginPath();
  g.moveTo(startX, startY);
  g.quadraticCurveTo(outerX, outerY, tipX, tipY);
  g.quadraticCurveTo(innerX, innerY, startX, startY);
  g.fillStyle = '#7bdceb';
  g.fill();
  g.strokeStyle = '#edffff';
  g.lineWidth = lightIndex === (attack === 0 ? 0 : 1) ? 3 : 1.5;
  g.beginPath();
  g.moveTo(startX, startY);
  g.quadraticCurveTo(outerX, outerY, tipX, tipY);
  g.stroke();
}
function comboFrame() {
  const cycle = time % (chainDuration + 550);
  const next = combo.findIndex(beat => beat.start > cycle);
  return next === -1 ? combo.length - 1 : next - 1;
}
function renderCombo() {
  const canvas = canvases[moveClips.length];
  const g = canvas.getContext('2d');
  const index = manualCombo ?? comboFrame();
  const beat = combo[index];
  const image = images[moveClips.length + beat.attack];
  const floor = 390;
  g.clearRect(0, 0, canvas.width, canvas.height);
  g.imageSmoothingEnabled = false;
  g.fillStyle = '#83a254';
  g.fillRect(0, floor, canvas.width, 4);
  g.fillStyle = '#493d33';
  g.fillRect(0, floor + 4, canvas.width, 36);
  g.save();
  g.translate(canvas.width / 2, floor);
  if (flip) g.scale(-1, 1);
  g.translate(beat.x, 0);
  if (image.complete && image.naturalWidth) {
    drawPose(g, image, beat.pose, beat.clip.scale, null);
    drawBladeLight(g, beat.attack, beat.frame);
  }
  g.restore();
  labels[moveClips.length].textContent = '第 ' + (beat.attack + 1) + ' 段 · ' + beat.clip.title
    + ' · 第 ' + (beat.frame + 1) + ' / 8 帧';
}
function render() {
  moveClips.forEach((clip, index) => {
    const count = clip.frames.length;
    const cycleTime = time % (count * clip.duration + (clip.hold ?? 0));
    const progress = manual === null ? Math.min(cycleTime / clip.duration, count - 1) : manual[index];
    const frame = Math.floor(progress);
    const next = Math.min(frame + 1, count - 1);
    const offset = values => values ? values[frame] + (values[next] - values[frame]) * (progress - frame) : 0;
    const canvas = canvases[index];
    const g = canvas.getContext('2d');
    const floor = 390;
    g.clearRect(0, 0, canvas.width, canvas.height);
    g.imageSmoothingEnabled = false;
    g.fillStyle = '#83a254';
    g.fillRect(0, floor, canvas.width, 4);
    g.fillStyle = '#493d33';
    g.fillRect(0, floor + 4, canvas.width, 36);
    g.save();
    g.translate(canvas.width * .44, floor);
    if (flip) g.scale(-1, 1);
    g.translate(offset(clip.offsetX), offset(clip.offsetY));
    if (images[index].complete && images[index].naturalWidth) {
      drawPose(g, images[index], clip.frames[frame], clip.scale ?? .94, clip.title === '行走' ? frame : null);
    }
    g.restore();
    labels[index].textContent = '第 ' + (frame + 1) + ' / ' + count + ' 帧';
  });
  renderCombo();
}
document.getElementById('play').onclick=()=>{playing=!playing;if(playing){manual=null;manualCombo=null;}document.getElementById('play').textContent=playing?'暂停':'继续播放'};
document.getElementById('speed').onchange=e=>speed=Number(e.target.value);document.getElementById('flip').onclick=e=>{flip=!flip;e.target.textContent='朝向：'+(flip?'左':'右');render()};
function step(d){playing=false;document.getElementById('play').textContent='继续播放';manualCombo=((manualCombo??comboFrame())+d+combo.length)%combo.length;manual=moveClips.map((clip,index)=>{const count=clip.frames.length;const cycle=time%(count*clip.duration+(clip.hold??0));const current=manual?.[index]??Math.min(Math.floor(cycle/clip.duration),count-1);return (current+d+count)%count});render()}
document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);
function loop(now){if(last&&playing)time+=Math.min(100,now-last)*speed;last=now;render();requestAnimationFrame(loop)}
Promise.all(images.map(i=>i.decode())).then(()=>requestAnimationFrame(loop)).catch(()=>labels.forEach(l=>l.textContent='未找到PNG：请将预览与图集放在同一个文件夹。'));
</script></html>
