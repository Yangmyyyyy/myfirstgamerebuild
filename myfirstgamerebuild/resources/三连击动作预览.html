<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>骑士三连击动作预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#121a20;color:#e9eff0;font:16px system-ui,"Microsoft YaHei",sans-serif;padding:26px}main{max-width:1180px;margin:auto}h1{font-size:26px;margin:0 0 10px}p{color:#b5c3c8;line-height:1.6}button,select{font:inherit;padding:9px 17px;border-radius:8px;border:1px solid #53626d;background:#25343f;color:#f2f4f5;cursor:pointer}button:hover{background:#364957}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0}canvas{display:block;width:100%;background:linear-gradient(#263640,#1a262e);border:1px solid #3e515b;border-radius:12px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}.card h2{font-size:18px}.status{min-height:28px;color:#e6c892;margin:10px 0}.tip{font-size:14px}@media(max-width:760px){.cards{grid-template-columns:1fr}body{padding:14px}}
</style>
<main><h1>骑士三连击 · 动作预览</h1><p>先看姿势、重心和衔接，再确定伤害窗口。当前预览不结算伤害。</p>
<div class="controls"><button id="pause">暂停</button><button id="restart">从头播放</button><label>播放速度 <select id="speed"><option value="0.7">0.7倍 · 慢看</option><option value="1" selected>1倍</option><option value="1.3">1.3倍</option></select></label><button id="prev">上一帧</button><button id="next">下一帧</button></div>
<canvas id="combo" width="1100" height="370"></canvas><div id="status" class="status">正在加载动作图片…</div>
<div class="cards"><section class="card"><h2>第一段：竖劈</h2><canvas width="500" height="330"></canvas></section><section class="card"><h2>第二段：横劈</h2><canvas width="500" height="330"></canvas></section><section class="card"><h2>第三段：突刺</h2><canvas width="500" height="330"></canvas></section></div>
<p class="tip">每段八帧。暂停后可逐帧查看。下方三个窗口分别循环，上方依次播放三段。当前是动作初稿，尚未接入游戏；剑、盾和身体的连续性仍需检查。</p></main>
<script>
const clips=[{"file": "knight_combo1_downslash_v2.png", "title": "第一段 · 竖劈", "frames": [{"x": 60, "y": 116, "w": 277, "h": 298, "anchorX": 221.75, "anchorY": 412}, {"x": 501, "y": 137, "w": 282, "h": 277, "anchorX": 665.25, "anchorY": 412}, {"x": 941, "y": 61, "w": 285, "h": 353, "anchorX": 1108.75, "anchorY": 412}, {"x": 1369, "y": 57, "w": 391, "h": 357, "anchorX": 1552.25, "anchorY": 412}, {"x": 42, "y": 557, "w": 377, "h": 301, "anchorX": 221.75, "anchorY": 856}, {"x": 481, "y": 580, "w": 364, "h": 278, "anchorX": 665.25, "anchorY": 856}, {"x": 924, "y": 578, "w": 312, "h": 280, "anchorX": 1108.75, "anchorY": 856}, {"x": 1367, "y": 572, "w": 306, "h": 286, "anchorX": 1552.25, "anchorY": 856}]}, {"file": "knight_combo2_sideslash_v2.png", "title": "第二段 · 横劈", "frames": [{"x": 64, "y": 114, "w": 291, "h": 292, "anchorX": 221.75, "anchorY": 404}, {"x": 492, "y": 125, "w": 307, "h": 281, "anchorX": 665.25, "anchorY": 404}, {"x": 926, "y": 132, "w": 305, "h": 274, "anchorX": 1108.75, "anchorY": 404}, {"x": 1342, "y": 137, "w": 400, "h": 269, "anchorX": 1552.25, "anchorY": 404}, {"x": 55, "y": 572, "w": 415, "h": 279, "anchorX": 221.75, "anchorY": 849}, {"x": 504, "y": 570, "w": 351, "h": 281, "anchorX": 665.25, "anchorY": 849}, {"x": 911, "y": 571, "w": 308, "h": 280, "anchorX": 1108.75, "anchorY": 849}, {"x": 1360, "y": 571, "w": 305, "h": 280, "anchorX": 1552.25, "anchorY": 849}]}, {"file": "knight_combo3_thrust_v2.png", "title": "第三段 · 突刺", "frames": [{"x": 46, "y": 118, "w": 296, "h": 286, "anchorX": 221.75, "anchorY": 402}, {"x": 498, "y": 119, "w": 284, "h": 285, "anchorX": 665.25, "anchorY": 402}, {"x": 950, "y": 133, "w": 284, "h": 271, "anchorX": 1108.75, "anchorY": 402}, {"x": 1365, "y": 126, "w": 377, "h": 278, "anchorX": 1552.25, "anchorY": 402}, {"x": 19, "y": 570, "w": 416, "h": 277, "anchorX": 221.75, "anchorY": 845}, {"x": 469, "y": 570, "w": 406, "h": 277, "anchorX": 665.25, "anchorY": 845}, {"x": 924, "y": 563, "w": 299, "h": 280, "anchorX": 1108.75, "anchorY": 841}, {"x": 1378, "y": 559, "w": 301, "h": 288, "anchorX": 1552.25, "anchorY": 845}]}];
const durations=[80,80,100,45,55,80,90,130];
const length=durations.reduce((a,b)=>a+b,0),cycle=length*3+450;
const images=clips.map(clip=>{const image=new Image();image.src=clip.file;return image});
const main=document.getElementById('combo'),cards=[...document.querySelectorAll('.card canvas')];
let time=0,last=0,playing=true,speed=1;
function frameAt(t){let total=0;for(let i=0;i<8;i++){total+=durations[i];if(t<total)return i}return 7}
function draw(canvas,clip,frame,large=false){const g=canvas.getContext('2d');g.clearRect(0,0,canvas.width,canvas.height);g.imageSmoothingEnabled=false;const ground=canvas.height-40;g.fillStyle='#476850';g.fillRect(0,ground,canvas.width,3);const f=clips[clip].frames[frame],scale=large?0.78:0.68;const root=canvas.width/2;g.fillStyle='rgba(0,0,0,0.18)';g.beginPath();g.ellipse(root,ground+2,48,5,0,0,Math.PI*2);g.fill();if(images[clip].complete&&images[clip].naturalWidth)g.drawImage(images[clip],f.x,f.y,f.w,f.h,root+(f.x-f.anchorX)*scale,ground+(f.y-f.anchorY)*scale,f.w*scale,f.h*scale)}
function render(){let at=time%cycle;const clip=at>=length*3?2:Math.floor(at/length);const t=at>=length*3?length-1:at%length;const frame=frameAt(t);draw(main,clip,frame,true);cards.forEach((c,i)=>draw(c,i,frameAt(time%length)));document.getElementById('status').textContent=clips[clip].title+'　｜　第 '+(frame+1)+' / 8 帧　｜　'+(frame<3?'蓄势':frame<5?'出招':'收势')}
function pause(){playing=false;document.getElementById('pause').textContent='继续播放'}
document.getElementById('pause').onclick=()=>{playing=!playing;document.getElementById('pause').textContent=playing?'暂停':'继续播放'};
document.getElementById('speed').onchange=e=>speed=Number(e.target.value);
document.getElementById('restart').onclick=()=>{time=0;render()};
function step(direction){pause();const at=time%cycle;let clip=Math.min(2,Math.floor(at/length)),frame=frameAt(at%length);frame+=direction;if(frame<0){clip=(clip+2)%3;frame=7}if(frame>7){clip=(clip+1)%3;frame=0}time=clip*length+durations.slice(0,frame).reduce((a,b)=>a+b,0)+1;render()}
document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);
function loop(now){if(last&&playing)time+=Math.min(now-last,100)*speed;last=now;render();requestAnimationFrame(loop)}
Promise.all(images.map(im=>new Promise((resolve,reject)=>{im.onload=resolve;im.onerror=reject;if(im.complete&&im.naturalWidth)resolve()}))).then(()=>requestAnimationFrame(loop)).catch(()=>document.getElementById('status').textContent='图片未找到：请把本预览和三张动作PNG放在同一个文件夹。');
</script></html>
